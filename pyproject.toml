[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codesentinel"
version = "0.13.6"
description = "Desktop source-code security review: SAST, SCA, secrets, IaC and threat modelling"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13", "pyyaml>=6", "psutil>=5.9", "PySide6>=6.6", "reportlab>=4", "python-docx>=1.1", "openpyxl>=3.1"]


[project.scripts]
codesentinel = "codesentinel.cli:app"

[project.gui-scripts]
codesentinel-app = "codesentinel.gui:main"

[tool.setuptools]
packages = ["codesentinel"]

[tool.setuptools.package-data]
codesentinel = ["rules/*.yml"]
